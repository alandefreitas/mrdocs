# yaml-language-server: $schema=../schemas/0-criteria.schema.yml
# Level 0: the research criteria. GENERATED by `pipeline.py criteria` from research/HOW-TO-GIVE-GREAT-TALKS.md and
# tools/criteria_map.py; edit those, not this file. Schema: ../schemas/0-criteria.schema.yml
about: >-
  Every claim of research/HOW-TO-GIVE-GREAT-TALKS.md, one entry each, with the check(s) that enforce it and the
  pipeline level where that happens. Generated by tools/pipeline.py criteria from tools/criteria_map.py; edit the
  map, not this file.
checks:
  M1:
    level: meta
    kind: schema
    what: >-
      The idea statement is at most fifteen words, short enough to be repeated by someone who heard it once. The
      conclusions slide must show it verbatim and at least three slides must restate it.
  M2:
    level: meta
    kind: schema
    what: >-
      The audience is described: who they are, what they share, what they know, whether they read a picture unaided.
      Every later choice is made for this audience, so it has to be on paper first.
  M3:
    level: meta
    kind: script
    what: >-
      The take-home is a problem, a proof and an action, none of them a restatement of the one idea, and each is
      said somewhere in the notes, because a point the speaker never says cannot be taken home.
  M4:
    level: meta
    kind: schema
    what: >-
      There is a promise: what the listener will be able to do afterwards that they could not before. It is the
      reason to stay, and it must be said in the first ten minutes.
  M5:
    level: meta
    kind: schema
    what: >-
      What is and what could be are both written down, so the story can open on the gap between them and the middle
      can alternate across it.
  M6:
    level: meta
    kind: schema
    what: There is exactly one call to action, so the audience leaves with one thing to do rather than a list.
  M7:
    level: meta
    kind: schema
    what: >-
      The questions policy is decided: when the floor is open, whether the room is told, and what happens if someone
      asks anyway. It is said near the start only when the decision is to announce it.
  M8:
    level: meta
    kind: schema
    what: >-
      The slot is recorded: length, questions, buffer, time, whether it is filmed, the 16:9 shape, the speaking
      pace, and whether the talk exposes or teaches. The rest of the pipeline sizes itself from these.
  M9:
    level: meta
    kind: schema
    what: >-
      The speaker has used or built the thing: at least one piece of evidence of ownership, because competence is
      where confidence comes from.
  M10:
    level: meta
    kind: schema
    what: >-
      Someone other than the speaker gains from the idea. An idea that serves only the speaker is not worth a talk.
  M11:
    level: meta
    kind: schema
    what: >-
      The handout is something other than the slides, because slides that work as a handout do not work as slides.
  M12:
    level: meta
    kind: schema
    what: >-
      The contested points are decided and written down (opening joke and self-introduction, closing words, background,
      slide numbers, questions, pointer, tour coverage), so the deck and the notes follow one policy instead of
      drifting between the sides of a disagreement.
  P1:
    level: plan
    kind: script
    what: >-
      acts carry the story-spine beats in order: once upon a time, every day, until one day, because of that, until
      finally, ever since then
  P2:
    level: plan
    kind: script
    what: >-
      opening act has both sides of the gap; the middle crosses it at least twice, between acts or inside beats
      flagged contrast
  P3:
    level: plan
    kind: schema
    what: an explicit dramatic question in the opening act
  P4:
    level: plan
    kind: script
    what: at least one moment of change (a turn) in the middle
  P5:
    level: plan
    kind: script
    what: >-
      the insight answers the dramatic question outright, in words other than the idea statement, and is said in
      the notes
  P6:
    level: plan
    kind: script
    what: >-
      every act declares an arousal target; at least one act targets a high-arousal emotion; none targets sadness
  P7:
    level: plan
    kind: script
    what: exactly one star moment
  P8:
    level: plan
    kind: schema
    what: 'fence: what the idea is not, and what it is confused with'
  P9:
    level: plan
    kind: script
    what: the one idea is restated in at least three acts (cycles_idea)
  P10:
    level: plan
    kind: script
    what: roadmap chapters, each with a mnemonic image asset that exists; at most five
  P11:
    level: plan
    kind: script
    what: >-
      the candidate dump is prose, at least twice the chapter points in weight; the documentation pages in nav.adoc
      count as candidates when the prose points at them, so the docs are referenced, not copied
  P12:
    level: plan
    kind: script
    what: every claim has at least one evidence item; items marked verify are verified before strict mode
  P13:
    level: plan
    kind: script
    what: at least one metaphor drawn from something the audience already knows
  P14:
    level: plan
    kind: script
    what: closing act references the opening beat (full circle)
  P15:
    level: plan
    kind: schema
    what: closing act has new_bliss text
  P16:
    level: plan
    kind: schema
    what: 'context (situate): the problem, who else works on it, why it matters'
  P17:
    level: plan
    kind: schema
    what: 'memorability: symbol, surprise, salient idea; the slogan is the idea statement itself'
  P18:
    level: plan
    kind: script
    what: beat minutes sum to the meta file's talk minutes, within one minute
  P19:
    level: plan
    kind: script
    what: every beat has transition words, and the notes of its first slide contain them
  P20:
    level: plan
    kind: script
    what: >-
      every beat either carries at least one claim of its act or states its purpose (a transition, a demo, an ask),
      so no stretch of speech exists without a reason
  P21:
    level: plan
    kind: script
    what: a beat that explains a system names the earlier beat that introduced its parts
  P22:
    level: plan
    kind: script
    what: >-
      no beat longer than six minutes without a pause or a question to the room (segmenting is Mayer2003; the six-minute
      figure is a policy, not evidence)
  P23:
    level: plan
    kind: script
    what: at least one beat asks the room a question and waits (warns if absent)
  P24:
    level: plan
    kind: script
    what: at least two distinct media kinds across the talk (live page, code, diagram, image)
  P25:
    level: plan
    kind: script
    what: closing act has at least two beats and at least two minutes
  P26:
    level: plan
    kind: script
    what: a beat flagged establishes_vision starts within the first five minutes
  P28:
    level: plan
    kind: script
    what: >-
      every claim of an act is carried by at least one of its beats (the beat lists the claim ids it delivers),
      and beats name only claims that exist
  S1:
    level: slides
    kind: script
    what: >-
      first slide is the title card; conclusions slide is the last non-backup slide; call-to-action slide precedes
      it
  S2:
    level: slides
    kind: script
    what: >-
      on-screen limits by kind: word ≤3 words, line ≤14 words, table ≤4x4, code ≤8 lines and ≤60 columns, list-like
      text forbidden
  S3:
    level: slides
    kind: schema
    what: every slide has exactly one assertion sentence
  S4:
    level: slides
    kind: script
    what: >-
      slide durations sum to the talk minutes within ten percent; no slide over 120 s; at least 20 slides (the count
      floor is a policy following Conway2014 and Phillips2014, both expert)
  S5:
    level: slides
    kind: script
    what: >-
      motion is declared only where it shows a relation (a morph sharing an element with the previous slide, or
      a named transition); a declared morph must share an element with its predecessor; every other slide uses the
      deck's default transition, which the audience reads as "next"
  S6:
    level: slides
    kind: script
    what: >-
      image and diagram slides carry the explanation in notes (≥40 words) and at most 14 words on screen; example
      slides (code, snippet, rendered) are shown while a sentence is said and have no floor
  S7:
    level: slides
    kind: script
    what: every slide that is not an example carries at least twelve words of notes unless marked silent
  S8:
    level: slides
    kind: script
    what: every referenced asset file exists
  S9:
    level: slides
    kind: script
    what: >-
      no run of more than eight consecutive on-screen words appears verbatim in the notes (no transcript on screen)
  S10:
    level: slides
    kind: schema
    what: image slides declare image_role represents|explains; decorative is not a value
  S11:
    level: slides
    kind: schema
    what: diagram and chart slides declare labels integrated and a chart_kind with a rationale
  S12:
    level: slides
    kind: script
    what: >-
      every highlight after the first on a code slide carries its own notes; a highlight is a point being made
  S13:
    level: slides
    kind: schema
    what: code steps of at most forty lines each, in sequence; a longer file is shown as parts
  S14:
    level: slides
    kind: script
    what: backup slides only after the conclusions slide
  S15:
    level: slides
    kind: script
    what: exactly one slide flagged star_moment, and it matches the story's
  S16:
    level: slides
    kind: script
    what: conclusions slide on-screen text is the one idea; it is not Questions? or Thank you
  S17:
    level: slides
    kind: script
    what: call-to-action slide carries a URL and a QR asset that exists
  S18:
    level: slides
    kind: script
    what: title card asset exists and is 16:9
  S19:
    level: slides
    kind: script
    what: at most one slide flagged deliberately_complex
  S20:
    level: slides
    kind: script
    what: at least three slides flagged restates_idea
  S22:
    level: slides
    kind: script
    what: >-
      banned phrases absent from notes: apologies, 'is the mic on', 'a lot to tell you', 'great question', 'I'm
      not good at this'
  S23:
    level: slides
    kind: script
    what: >-
      opening slide notes contain the promise, the questions policy when it is announced, and the applause/attention
      cue
  S24:
    level: slides
    kind: script
    what: no on-screen text of kind line ends with a question mark unless flagged hostile_audience
  S25:
    level: slides
    kind: script
    what: 'image and diagram slides declare emphasis: the element that is largest and why'
  S26:
    level: slides
    kind: script
    what: notes across the talk use inclusive 'we' at least ten times
  S27:
    level: slides
    kind: script
    what: >-
      speaking time implied by the notes at the meta speaking rate matches each slide's declared duration (within
      0.6x to 1.6x) and the total matches the talk within 15%; the research offers only rules of thumb on time (a
      minute per slide, expert), so timing comes from the script, not from a rule
  S29:
    level: slides
    kind: script
    what: >-
      every beat has at least one slide, the slides of a beat are contiguous, and the beats appear in the deck in
      the order of the plan
  H1:
    level: html
    kind: script
    what: one top-level section per slide, same ids and order, notes present
  H2:
    level: html
    kind: script
    what: no <ul>/<ol> inside slide sections
  H3:
    level: html
    kind: script
    what: Reveal canvas is 16:9
  H4:
    level: html
    kind: script
    what: >-
      theme: base font at least 40px on the 1600 canvas (Winston2018's floor, expert), no uppercase transform outside
      covers, no italic runs, at most three typefaces
  H5:
    level: html
    kind: script
    what: theme hides controls, progress and slide number on covers and subdues them elsewhere
  H6:
    level: html
    kind: script
    what: no logo, title bar or header element in non-cover sections
  H7:
    level: html
    kind: script
    what: no per-slide background except the title card and live pages
  H8:
    level: html
    kind: script
    what: consecutive auto-animate sections share at least one data-id
  H9:
    level: html
    kind: script
    what: >-
      no <audio>, no autoplay video, transitions limited to none/fade/slide plus one zoom (decorative motion and
      sound are the seductive details of Mayer2003 and Kosslyn2012; the one-zoom allowance is a policy)
  H10:
    level: html
    kind: script
    what: contrast of text colours on the canvas ≥ 4.5:1, computed from CSS variables
  H11:
    level: html
    kind: script
    what: build produced index.html, a PDF, and a contact sheet
  D1:
    level: logs
    kind: logged
    what: >-
      at least three live, timed rehearsals within the slot, at least one to people who do not know the work
  D2:
    level: logs
    kind: logged
    what: at least one rehearsal recorded and reviewed, with captions check
  D3:
    level: logs
    kind: logged
    what: equipment tested; PDF and still-image backups listed; contingency for clicker failure
  D4:
    level: logs
    kind: logged
    what: room visited (warns if not yet)
  D5:
    level: logs
    kind: logged
    what: lights-up request recorded
  D6:
    level: logs
    kind: logged
    what: pre-talk ritual includes the 'I am excited' relabel
  D7:
    level: logs
    kind: logged
    what: Q&A conduct checklist acknowledged
  D8:
    level: logs
    kind: logged
    what: feedback plan recorded
  R1:
    level: reviews
    kind: review
    what: 'narrative read-through: flow, one idea, no tangents, story causes not lists'
  R2:
    level: reviews
    kind: review
    what: humour is inside a safe story, relevant, not at the open
  R3:
    level: reviews
    kind: review
    what: metaphors and examples are familiar to this audience
  R4:
    level: reviews
    kind: review
    what: >-
      each slide gives its point to a lapsed listener; nothing on screen you will not talk about; amount feels 'about
      right'
  R5:
    level: reviews
    kind: review
    what: 'delivery review of the recording: energy, eye contact, pace, hands, pauses, not reading'
  N/A:
    level: none
    kind: informational
    what: >-
      descriptive or background claim, or a myth: a belief the research found unsupported. Refuting a belief creates
      no criterion; where a positive finding exists it is mapped under its own claim and the note says which.
criteria:
- id: C1-01
  section: 1. What a talk is for
  claim: >-
    The speaker's one job is to build an idea in the listeners' minds: a pattern of understanding that was not there
    before, made only of a voice and a face.
  sources:
  - Anderson2016
  - Stephens2010
  evidence: expert
  evidence_level: expert
  checks:
  - M1
  - P5
  - S16
  - S20
  levels:
  - meta
  - plan
  - slides
  enforcement:
  - schema
  - script
  note: >-
    the statement is the handle shown on the last slide; the insight is the same idea explained at the reveal
- id: C1-02
  section: 1. What a talk is for
  claim: The audience is the hero of the talk, not the speaker.
  sources:
  - Duarte2011
  evidence: expert
  evidence_level: expert
  checks:
  - M4
  - M5
  - M10
  levels:
  - meta
  enforcement:
  - schema
  note: >-
    implied: a promise to the audience, a take-home for the audience and a benefit to the audience leave nobody
    else to be the hero; no field of its own
- id: C1-03
  section: 1. What a talk is for
  claim: Speaking is learnable.
  sources:
  - Winston2018
  evidence: expert
  evidence_level: expert
  checks:
  - N/A
  levels:
  - none
  enforcement:
  - informational
  note: background
- id: C1-04
  section: 1. What a talk is for
  claim: Talk only about what you know and, if possible, love.
  sources:
  - Conway2014
  evidence: expert
  evidence_level: expert
  checks:
  - M9
  - R5
  levels:
  - meta
  - reviews
  enforcement:
  - review
  - schema
- id: C1-05
  section: 1. What a talk is for
  claim: Decide what the talk is doing.
  sources:
  - Winston2018
  evidence: expert
  evidence_level: expert
  checks:
  - M8
  levels:
  - meta
  enforcement:
  - schema
  note: mode=expose
- id: C1-06
  section: 1. What a talk is for
  claim: >-
    Decide what it is for before designing anything: the second most frequent piece of expert advice is to know
    the audience (53% of advice articles), and 29% say to develop an explicit objective for the talk first.
  sources:
  - Blome2017
  evidence: expert consensus
  evidence_level: expert
  checks:
  - M2
  - M3
  levels:
  - meta
  enforcement:
  - schema
  - script
- id: C1-07
  section: 1. What a talk is for
  claim: An idea is worth a talk only if someone other than the speaker gains from it.
  sources:
  - Anderson2016
  evidence: expert
  evidence_level: expert
  checks:
  - M10
  levels:
  - meta
  enforcement:
  - schema
  note: idea.benefit
- id: C1-08
  section: 1. What a talk is for
  claim: >-
    Slides are asked to do four jobs at once (speaker's notes, the audience's visual, a handout to study later,
    a substitute for a paper) and fail when one set tries to do all four.
  sources:
  - Alley2005
  - Berk2012
  - Conway2014
  - Naegle2021
  evidence: expert, citing Donald Norman
  evidence_level: expert
  checks:
  - M11
  - S14
  levels:
  - meta
  - slides
  enforcement:
  - schema
  - script
  note: the docs site is the handout; what the tour visits is the plan, not a checked property
- id: C1-09
  section: 1. What a talk is for
  claim: >-
    Know the audience before writing a word: who they are, what they share, how much they already know, whether
    they care and which facet makes them care (being entertained, instructed, or moved), and what is in it for them.
  sources:
  - Blome2017
  - Freitas2026
  evidence: own
  evidence_level: own
  checks:
  - M2
  levels:
  - meta
  enforcement:
  - schema
- id: C1-10
  section: 1. What a talk is for
  claim: Meaning only attaches to what the audience already knows.
  sources:
  - Anderson2016
  - Garner2009
  - Kosslyn2012
  evidence: expert, grounded in the memory literature
  evidence_level: expert
  checks:
  - P13
  - R3
  levels:
  - plan
  - reviews
  enforcement:
  - review
  - script
- id: C1-11
  section: 1. What a talk is for
  claim: Say what is necessary and nothing else.
  sources:
  - Freitas2026
  - Kosslyn2012
  evidence: own
  evidence_level: own
  checks:
  - S2
  - S9
  - R1
  levels:
  - reviews
  - slides
  enforcement:
  - review
  - script
- id: C1-12
  section: 1. What a talk is for
  claim: 'Speak inclusively: are *we* in this together.'
  sources:
  - Freitas2026
  evidence: own
  evidence_level: own
  checks:
  - S26
  levels:
  - slides
  enforcement:
  - script
- id: C1-13
  section: 1. What a talk is for
  claim: Who you are carries less than you might think.
  sources:
  - Sugimoto2013
  - Tsou2014
  evidence: obs
  evidence_level: obs
  checks:
  - N/A
  levels:
  - none
  enforcement:
  - informational
  note: the talk does the work; no artefact
- id: C1-14
  section: 1. What a talk is for
  claim: What gets a recording passed on is arousal, not just approval.
  sources:
  - Berger2012
  evidence: obs, 6,956 articles; exp, three experiments
  evidence_level: exp
  checks:
  - P6
  levels:
  - plan
  enforcement:
  - script
- id: C1-15
  section: 1. What a talk is for
  claim: Audiences judge the talk and the speaker together.
  sources:
  - Moulton2017
  evidence: exp
  evidence_level: exp
  checks:
  - N/A
  levels:
  - none
  enforcement:
  - informational
  note: consequence, not an action
- id: C2-1-01
  section: 2.1 Choosing what to say
  claim: One talk carries one idea.
  sources:
  - Anderson2016
  - Freitas2026
  - Winston2018
  evidence: own
  evidence_level: own
  checks:
  - M1
  - S16
  levels:
  - meta
  - slides
  enforcement:
  - schema
  - script
- id: C2-1-02
  section: 2.1 Choosing what to say
  claim: >-
    Do not start from "what should I say?": people are bad at *recalling* what matters and good at *recognising*
    it when shown.
  sources:
  - Conway2014
  evidence: expert
  evidence_level: expert
  checks:
  - P11
  levels:
  - plan
  enforcement:
  - script
  note: candidate dump recorded in story.yml
- id: C2-1-03
  section: 2.1 Choosing what to say
  claim: The five must make a story.
  sources:
  - Conway2014
  evidence: expert
  evidence_level: expert
  checks:
  - P11
  - R1
  levels:
  - plan
  - reviews
  enforcement:
  - review
  - script
- id: C2-1-04
  section: 2.1 Choosing what to say
  claim: >-
    Frame the whole talk as a contrast between *what is* and *what could be*: the status quo, and the world with
    the idea adopted.
  sources:
  - Duarte2011
  evidence: expert
  evidence_level: expert
  checks:
  - M5
  - P2
  levels:
  - meta
  - plan
  enforcement:
  - schema
  - script
- id: C2-1-05
  section: 2.1 Choosing what to say
  claim: Build it as a story with a question, a turn, and a revealed point.
  sources:
  - Huang2020
  evidence: obs, 306 videos
  evidence_level: obs
  checks:
  - P3
  - P4
  - P5
  - P6
  levels:
  - plan
  enforcement:
  - schema
  - script
  note: the revealed point is the insight, said outright at the reveal
- id: C2-1-06
  section: 2.1 Choosing what to say
  claim: >-
    Test of a good talk: a week later, an audience member can name three points, and they are the three you meant.
  sources:
  - Bourne2007
  - Lortie2017
  evidence: expert
  evidence_level: expert
  checks:
  - M3
  levels:
  - meta
  enforcement:
  - script
- id: C2-1-07
  section: 2.1 Choosing what to say
  claim: >-
    Only talk when you have something to say; the audience's time is not for uninteresting preliminary material.
  sources:
  - Bourne2007
  evidence: expert
  evidence_level: expert
  checks:
  - M3
  - P20
  levels:
  - meta
  - plan
  enforcement:
  - script
  note: >-
    three points or nothing; and a beat with nothing to deliver and no purpose is talking without something to say
- id: C2-2-01
  section: 2.2 Opening
  claim: The first thirty seconds decide whether the room is with you.
  sources:
  - Freitas2026
  evidence: own
  evidence_level: own
  checks:
  - R1
  levels:
  - reviews
  enforcement:
  - review
  note: first sixty words of the opening reviewed
- id: C2-2-02
  section: 2.2 Opening
  claim: Open with a story prepared better than anything else in the talk.
  sources:
  - Freitas2026
  evidence: own
  evidence_level: own
  checks:
  - P1
  - D1
  levels:
  - logs
  - plan
  enforcement:
  - logged
  - script
  note: opening rehearsed in every session
- id: C2-2-03
  section: 2.2 Opening
  claim: Earn the right to build before building.
  sources:
  - Anderson2016
  - Duarte2011
  evidence: expert
  evidence_level: expert
  checks:
  - P3
  - P2
  levels:
  - plan
  enforcement:
  - schema
  - script
- id: C2-2-04
  section: 2.2 Opening
  claim: >-
    Open with an empowerment promise: tell people what they will know or be able to do at the end that they could
    not at the start.
  sources:
  - Winston2018
  evidence: expert
  evidence_level: expert
  checks:
  - M4
  - S23
  levels:
  - meta
  - slides
  enforcement:
  - schema
  - script
- id: C2-2-05
  section: 2.2 Opening
  claim: >-
    Define the topic and give a roadmap at the outset: people organise incoming information into a narrative largely
    without noticing, and an early outline makes that organisation match yours.
  sources:
  - Alley2005
  - Freitas2026
  - Kosslyn2012
  evidence: expert, citing memory research
  evidence_level: expert
  checks:
  - P10
  levels:
  - plan
  enforcement:
  - script
- id: C2-2-06
  section: 2.2 Opening
  claim: >-
    Three safe ways in: a story told as if to a child ("Once upon a time", "In 2009", "Once, we had this problem";
    always about people); a fact that shocks; a question that matters to this audience.
  sources:
  - Freitas2026
  evidence: own
  evidence_level: own
  checks:
  - P1
  levels:
  - plan
  enforcement:
