# yaml-language-server: $schema=../schemas/2-plan.schema.yml
# Level 2: the plan of the talk. The story as acts on the spine, each with its claims (the argument) and its beats (what is
# said, timed), each beat with its slides (what is on screen, and the notes); then the map (chapters). Beat target_minutes sum to the meta file's talk time (60 - 10 Q&A = 50).
# Schema: ../schemas/2-plan.schema.yml
dramatic_question: What if we just used the compiler?
# the answer, said outright at the reveal; the mechanism behind the idea statement, in different words on purpose
insight: It just uses the compiler under the hood.
fence:
  is_not:
  - >-
    It is not a prose or tutorial generator: overviews and design notes are still written by hand.
  - It is not a prose or tutorial on how to write good documentation.
  confused_with:
  - Doxygen with better templates.
  - Not about tools that parse declarations themselves.
context:
  problem: >-
    Documentation tools read C++ as text, so modern constructs come out wrong; libraries work around it with a
    documentation-only declaration behind a macro, which drifts from the real one, and shape the output by
    building a second toolchain on the tool's XML.
  others: >-
    Doxygen is the comparison because it is what everyone uses, and what the room has fought. Other
    generators exist (standardese, cldoc, clang-doc, Sphinx/Breathe, several of them built on Clang too),
    and the talk does not compare against them: it compares against the tool people actually have.
  # the design notes' case (docs/modules/ROOT/pages/design-notes.adoc, "Why automate documentation?") and its table
  why_matters: >-
    You know the most about a function the moment you write its signature, so the reference belongs
    next to the declaration, where it changes in the same diff and is more likely to be written at
    all. Reference written by hand stops scaling when the code outgrows one person's memory. Generated
    reference stays in sync with the source, is readable, IDE-friendly and AI-friendly, keeps a
    single source of truth with low author overhead, and needs no source-code workarounds, but only
    if the generator reads the headers as the compiler does; otherwise the parallel ill-formed
    declaration defeats the point, and the source no longer reflects what is compiled.
    See docs/modules/ROOT/pages/design-notes.adoc "Why automate documentation?" and its table
memorability:
  symbol: 261 (headers in Boost carrying a documentation-only fake declaration)
  surprise: >-
    A documentation tool that writes code back into your headers: a script generator emits the Boost.Describe
    annotations from the corpus, and the same hooks encode a project's naming conventions as official reference.
  salient_idea: Doxygen reads C++ as text.
metaphors:
- text: The macro layer is a second set of books kept for the auditor.
  familiar_because: >-
    Everyone knows what cooking the books is, whether or not they know the idiom: two versions of the
    numbers, and only the one nobody inspects is true. The comparison makes the drift feel like the
    fraud it is.
- text: Documenting C++ by reading it as text is writing documentation with carefully crafted regular expressions.
  familiar_because: >-
    The audience has written regular expressions against code and knows exactly where they break:
    templates, nesting, anything that needs the grammar rather than the characters.
# The curiosities that are not in the documentation, then a pointer to the documentation itself
# rather than a copy of it. P11 counts the pages in docs/modules/ROOT/nav.adoc as candidates.
candidate_points: |-
  Outside the documentation: Boost carries 261 headers with documentation-only declarations (180 Asio, 63
  Beast, 18 URL). Beast's websocket::stream hides its base class from Doxygen. Doxygen mangles concepts,
  requires clauses, decltype(auto) and algorithm function objects. The two declarations drift, and reviewers
  catch in the docs what the compiler would catch in code. Clang already knows every instantiation, deduced
  type, overload and constraint. The real origin: Vinnie Falco, frustrated with Doxygen, wanted a tool built
  on the compiler from the first day; the talk tells the generic version of that story, which is also true. 
  Beast and URL shaped their reference with docca, thousands of lines of XSLT over Doxygen's XML, a toolchain
  maintained only to process another tool's output. Beyond that, anything on the mrdocs.com landing page or 
  in the documentation is a candidate, page by page as docs/modules/ROOT/nav.adoc lists it; the chapters below
  choose from those pages rather than repeating them here.
acts:
- id: story
  label: 'Act 1. The story: what is, and the turn'
  spine:
  - once-upon-a-time
  - every-day
  - until-one-day
  - because-of-that
  - until-finally
  side: both
  arousal: tension
  cycles_idea: true
  moment_of_change: true
  star_moment: false
  opener_type: story
  # first the reason to generate reference at all (so nobody leaves Act 1 concluding "then don't document"), then
  # four problems, in causal order: the tool reads C++ as text, so constructs come out wrong; the workaround is a
  # macro layer (which some like: everything stays next to the code); the layer drifts; and the output cannot be
  # shaped, so a second toolchain grows on the XML. The drift is not the only problem, and for many people it is
  # not the biggest.
  claims:
  # the claim is the case for generated reference, from the design rationale; how the story introduces it (Boost, 2019,
  # "every day") is delivery, and lives in the beats and the slide notes
  - id: why-reference
    text: >-
      Reference documentation generated from the code beats reference written by hand, and no reference: it is written next
      to the declaration, at the moment the author knows the most and in the same commit as the signature; the output
      is friendlier to a reader than the source code; it is checked against the code on every build; IDEs show it on
      hover and in signature help; AI assistants read it straight from the code without fetching documentation from 
      the web or studying the implementation; and, when the generator reads the code as the compiler does, it costs
      the author almost nothing extra and is a single source of truth that cannot drift. Those last two hold only 
      in that ideal case, which is the case Mr.Docs makes.
    evidence:
    - kind: file
      ref: docs/modules/ROOT/pages/design-notes.adoc, "Why automate documentation?" and its comparison table
  # how the story introduces the tool ("the tool was Doxygen") is delivery, in the until-one-day slide notes
  - id: boost-doxygen
    text: >-
      Doxygen reads C++ as text, not as a compiler does: it gets close enough to be used, and everything it cannot
      parse comes out wrong or has to be worked around.
    evidence:
    - kind: memory
      ref: Alan's own experience on Boost.URL and Beast
      verify: true
      verified: false
    - kind: screenshot
      ref: >-
        assets/story/until-one-day.png: Doxygen 1.18.0 run on 2026-09-11 over a header with the three migration-notes
        idioms (detail:: return type, enable_if return type, algorithm function object); all three leak into the page
      verify: true
      verified: true
  - id: unsupported-constructs
    text: >-
      Ordinary modern C++ came out wrong or missing: concepts and requires clauses, SFINAE constraints, deduced
      return types, algorithm function objects, inherited members, a base class the tool simply did not see.
    evidence:
    - kind: file
      ref: docs/modules/ROOT/pages/design-notes.adoc, "Special C++ constructs" (the list of what needs a compiler)
    - kind: code
      ref: >-
        libs/beast/include/boost/beast/websocket/stream.hpp:146 (BOOST_BEAST_DOXYGEN guard around the
        base class)
  # the concession ("it even looks attractive: everything stays next to the code") is delivery, in the lie slide notes
  - id: macro-layer
    text: >-
      Libraries keep a second declaration behind a macro for the documentation tool: a documentation-only version of
      the truth, in the header, that the compiler never sees.
    evidence:
    - kind: grep
      ref: >-
        grep -rl <macro> libs --include='*.hpp' --include='*.ipp' --include='*.h' on the Boost checkout 9ce204d4d7
        (2025-12-17): GENERATING_DOCUMENTATION 180, BOOST_BEAST_DOXYGEN 63, BOOST_URL_DOCS 18; 261 headers
      verify: true
      verified: true
  - id: drift
    text: The two declarations drifted; nothing compiled the fake one.
    evidence:
    - kind: code
      ref: >-
        libs/beast/include/boost/beast/core/buffers_cat.hpp:84-92: the BOOST_BEAST_DOXYGEN declaration of buffers_cat
        takes `BufferSequence const&...`, the compiled one takes `B1 const&, Bn const&...`; two signatures for one
        function, only one of them ever compiled
    - kind: memory
      ref: a real drift instance from a Boost review
      verify: true
      verified: false
  - id: xml-workflow
    text: >-
      And the output could not be made to look like our documentation, so we had to take Doxygen's XML and build a second
      toolchain on it: XSLT into Quickbook, thousands of lines, maintained by us, just to process the XML. The second
      toolchain was very expensive to maintain.
    evidence:
    - kind: file
      ref: >-
        tools/docca/README.md in the Boost checkout (https://github.com/boostorg/docca): XSLT over Doxygen XML to
        Quickbook, used by Beast; libs/beast/doc/Jamfile:13-23 imports it
    - kind: grep
      ref: "wc -l tools/docca/docca.py tools/docca/include/docca/*.xsl: 3171 lines on the Boost checkout 9ce204d4d7"
      verify: true
      verified: true
  # until finally: the question, the tool, and one corpus feeding everything (the resolution of the story)
  - id: one-corpus
    text: >-
      Clang builds one symbol corpus from the real AST, and generators turn it into any output.
      Complete separation between extraction and presentation.
    evidence:
    - kind: file
      ref: docs/modules/ROOT/pages/index.adoc
  # the beats of this act, in order: what is said, one point each, with target minutes and transition words
  beats:
  - id: once
    label: Once upon a time
    target_minutes: 0.75
    # the whole opening happens over the conference's card: applause if any ("Thank you."), the attention catcher, a
    # pause, then the story as if to a child. No self-introduction and no agenda: the chair and the card have done the
    # first, and the roadmap comes after the story has earned it (C2-2-13, C2-2-05).
    transition_words: Good afternoon.
    purpose: >-
      Opens the talk over the title card: applause, the attention catcher, then two sentences: who we are, and what
      the story is about.
    media:
    - image
    slides:
    - id: cppcon-title-card
      kind: title-card
      on_screen: ''
      assertion: >-
        The conference's card stays up through the applause, the attention catcher and the first sentences of the
        story.
      notes: |-
        Alright. Tudo bem. (Getting attention)

        Good afternoon. (Pause. Look at the room.)
        I'm thankful and excited to be here. (If applause)
        
        I'm Alan. I work at the C++ Alliance, and a big part of what 
        we do is provide support and maintenance to Boost libraries.
        
        In my case, my love relationship with Boost started a long time 
        ago, around C++11.
        
        Over time, I've contributed to about 20 Boost libraries, and,
        more relevant to this story, I contributed to the workflows Boost uses for
        Continuous Integration, for its release process, for documentation, and
        for *reference* documentation. I know, all the thankless work. 
        
        Most Boost libraries have great reference documentation for historical 
        reasons, and most libraries use automated workflows to generate it from
        the code. That's the context where this tool was born. 
        And we're now sharing it.

        Today I'm going to talk about a workflow we developed to generate
        reference documentation from the code using Clang, and by the end of this talk
        you will be able to run Mr.Docs on your own library, and you will understand how
        this workflow gives you reference documentation you can trust.
      duration_s: 45
      silent: false
      assets:
      - assets/cppcon-title-card.png
      why: >-
        The opening happens over the conference's own card: no self-introduction (the chair and the card did that),
        no agenda, no slide of the speaker. The story starts as if to a child, about people, while the room is still
        looking at the card.
  - id: every-day
    label: Every day
    transition_words: And every day
    claims:
    - why-reference
    media:
    - line
    - table
    - code
    - image
    establishes_vision: true
    docs:
    - design-notes.adoc
    slides:
    - id: why-automate-quote
      kind: line
      on_screen: You know the most about a function the moment you write its signature.
      assertion: The reason the reference is written next to the code and generated from it.
      notes: |-
        So, every day, we wrote the documentation as comments next
        to symbols in the header. 
        
        That's a great workflow, because that's the moment when you understand 
        the symbol best. 
        If you wait for a week, then you'll start forgetting details. 
        If you wait for a month, you'll have to look at the calling sites to remember.
        Sometimes you even forget a function you wrote existed.
        
        Writing the comment right there captures what is already in your head.
        If you still forget about it, the workflow can give you a warning.
      why: >-
        The design-notes argument, told as the "every day" of the story rather than as a motivation slide, so nobody
        leaves Act 1 concluding that the answer is to stop documenting. Asserted on screen, argued in the notes
        (Alley).
    - id: every-day
      kind: code
      on_screen: ''
      assertion: >-
        A real Boost.URL doc comment from url_view_base.hpp: a brief, an example, the return, and the declaration
        it belongs to.
      why: >-
        The habit the room recognizes, shown once from the real header (libs/url/include/boost/url/url_view_base.hpp)
        between the sentence about why and the table of what we wanted; one block, the emphasis walks down it.
      code: |-
        /** Return true a scheme is present

            This function returns true if this
            contains a scheme.

            @par Example
            @code
            assert( url_view("http://example.com").has_scheme() );
            @endcode

            @par Complexity
            Constant.

            @return `true` if the url contains a scheme.
        */
        bool has_scheme() const noexcept;
      language: cpp
      notes: |-
        Here is what that looks like, in practice:
      highlights:
      - lines: '1'
        notes: |-
          A brief.
      - lines: '6-9'
        notes: |-
          An example.
      - lines: '14'
        notes: |-
          What it returns.
      - lines: '16'
        notes: |-
          And the declaration it belongs to, right underneath.
    - id: what-we-wanted
      kind: table
      on_screen: ''
      assertion: >-
        What we wanted from reference documentation, and how it was generated, by hand and none score against it.
      table:
        header:
        - ''
        - Generated
        - By hand
        - None
        rows:
        - - Convenient (author)
          - 'yes'
          - 'no'
          - 'yes'
        - - Friendly output (user)
          - 'yes'
          - 'yes'
          - 'no'
        - - AI-friendly
          - 'yes'
          - 'no'
          - 'no'
        - - IDE integration
          - 'yes'
          - 'no'
          - 'no'
        - - Verifiable
          - 'yes'
          - 'no'
          - 'no'
        - - In sync with source
          - 'yes'
          - 'no'
          - 'no'
        - - Single source of truth
          - 'yes'
          - 'no'
          - 'no'
        steps:
        - notes: |-
            On top of that, what else do we want from the reference documentation?
        - rows: [2]
          notes: |-
            When the user is exploring the official tutorial/exposition sections
            of the documentation and there's any mention of a symbol, they get
            link to this friendly, detailed page explaining what the symbol is, what else 
            it does, and how it's related to other symbols.
            
            Also, this friendly page is particularly important when the library 
            includes complex idioms and abstractions that are not part of the public API, such as
            metaprogramming, implementation details, or any form of reflection. Things
            should be represented differently in the official public API.
            
            For instance, consider how much nicer it is to read documentation from 
            cppreference than from the standard itself or the header files.
        - rows: [3]
          notes: |-
            Having the comments next to signatures is also great for AI agents, because they can
            read the comments as context while they edit the same file. Otherwise, the agent would
            have to fetch the documentation from the web, or read the implementation to figure out
            what it does. That would be much slower and spend much more of your precious tokens.
        - rows: [4]
          notes: |-
            You also get IDE integration for free when the comments are next to the code. Typically
            as a popup at the calling site.
        - rows: [5, 6, 7]
          notes: |-
            It also enforces that the documentation stays in sync with the source.
        - cols: [3]
          notes: |-
            Meanwhile, doing it by hand gives you the page and nothing else.
            One day you become busy with something else and the documentation drifts.
        - cols: [4]
          notes: |-
            In practice, "by hand" just means they're not going to do it at all. 
            In this case, you do get the convenience, but the users get nothing else.
        - cols: [2]
          notes: |-
            So: No trade-off at all and everything is perfect.
      motion:
        kind: auto-animate
        group: wanted
        shared:
        - table
      why: >-
        The design-notes table is split in two. This half is the criteria for good reference documentation and why
        generating it is the only way to meet them; it belongs to the "every day" of the story, before any tool
        is named, so the room agrees on the goal before hearing what broke. The other half (Mr.Docs against other
        tools) is a conclusion and sits at the end.
    - id: or-is-it
      kind: table
      on_screen: ''
      assertion: The same table, with the generated column turned into questions.
      table:
        header:
        - ''
        - Generated
        - By hand
        - None
        rows:
        - - Convenient (author)
          - maybe
          - 'no'
          - 'yes'
        - - Friendly output (user)
          - maybe
          - 'yes'
          - 'no'
        - - AI-friendly
          - maybe
          - 'no'
          - 'no'
        - - IDE integration
          - maybe
          - 'no'
          - 'no'
        - - Verifiable
          - maybe
          - 'no'
          - 'no'
        - - In sync with source
          - maybe
          - 'no'
          - 'no'
        - - Single source of truth
          - maybe
          - 'no'
          - 'no'
        highlight_cols:
        - 2
      motion:
        kind: auto-animate
        group: wanted
        shared:
        - table
      why: >-
        The turn of the every-day beat: the perfect table from the previous slide morphs into questions, and the
        room wants to know why before the story tells them. The checks become question marks in place, so the eye
        stays on the column it was just told to admire.
      notes: |-
        Or is it? Because in practice, things looked very different to us.
  - id: broke
    label: Until one day
    target_minutes: 1
    transition_words: One day you look at the output
    claims:
    - boost-doxygen
    - unsupported-constructs
    media:
    - image
    slides:
    - id: until-one-day
      kind: image
      on_screen: ''
      notes: |-
        One day you look at the output, and it just looks wrong.

        Lots of implementation details are leaking. When we looked 
        closer, sometimes some of the information wasn't even extracted.
        
        Not to mention presentation. The layout is misaligned; the font sizes are 
        inconsistent, there's no syntax highlighting, and you can't customize it 
        easily.
        
        At the time, we were proposing Boost.URL, our own library, and we had
        lots of these problems with doxygen and the workarounds we needed
        for these problems sometimes felt worse than the problem.
      assets:
      - assets/story/until-one-day.png
      image_role: explains
      emphasis:
        element: 'the twice() row: std::enable_if_t<std::is_integral_v<T>, T> where the return type should be'
        why: >-
          The constraint has leaked into the signature, and the detail:: type and the constexpr variable next to
          it are the other two idioms leaking; the page is what the header says, not what the author meant.
      assertion: >-
        A real Doxygen page (1.18, run today) of a header with the three idioms: a detail:: return type in the synopsis,
        an enable_if in the return type, and a function object documented as a variable.
      why: >-
        The break, shown on a real page rather than claimed: the header with the migration-notes idioms run through
        the current Doxygen. The three leaks are exactly the three things the configuration chapter later fixes
        with one line each.
  - id: lie
    label: Because of that, we lied to it
    target_minutes: 1
    transition_words: Because Doxygen sees the code as text
    claims:
    - macro-layer
    media:
    - code
    - word
    slides:
    - id: because-of-that-lie
      kind: code
      on_screen: ''
      why: >-
        The workaround for the first failure on the previous slide: the idiom as libraries write it, a
        representative form of the pattern.
      assertion: >-
        A fake declaration for the constrained function, behind a macro only the documentation tool defines.
      code: |-
        #ifdef BOOST_DOXYGEN
        template<class T> T twice(T x);
        #else
        template<class T>
        std::enable_if_t<std::is_integral_v<T>, T> twice(T x);
        #endif
      language: cpp
      notes: |-
        In this case, we used Doxygen. Because Doxygen sees the code as text, we start lying to it.
      highlights:
      - lines: '2'
        notes: |-
          The function is the official declaration.
      - lines: '4-5'
        notes: |-
          And only the compiler sees the real function.
    - id: because-of-that-lie-2
      kind: code
      on_screen: ''
      why: The workaround for the second failure, quoted from Beast's headers.
      assertion: A placeholder word standing in for the return type, in a shipped Boost header.
      code: |-
        #if BOOST_BEAST_DOXYGEN
        __implementation_defined__
        #else
        detail::bind_wrapper<
            typename std::decay<Handler>::type, Args...>
        #endif
        bind_handler(Handler&& handler, Args&&... args);
      language: cpp
      highlights:
      - lines: '2'
        notes: |-
          The implementation-defined types are replaced with a macro.
    - id: because-of-that-lie-3
      kind: code
      on_screen: ''
      notes: |-
        Macros to hide base classes.
      why: The workaround for the third failure, quoted from Beast's headers; the count is the bridge to the symbol 261.
      assertion: A base class hidden from one reader, in a shipped Boost header.
      code: |-
        class stream
        #if ! BOOST_BEAST_DOXYGEN
            : private stream_base
        #endif
        {
      language: cpp
      highlights:
      - '2-4'
  - id: drift
    label: Because of that, they drifted
    target_minutes: 1
    transition_words: And here's another example
    claims:
    - drift
    media:
    - code
    slides:
    - id: because-of-that-drift
      kind: code
      on_screen: ''
      why: >-
        Second "because of that". The emotional beat: reviewers finding by hand what a compiler finds for free.
        The diff is the picture; the highlight moves the eye.
      assertion: >-
        Two declarations of buffers_cat in Beast's buffers_cat.hpp: the one Doxygen reads and the one the compiler
        compiles, already different.
      motion:
        kind: auto-animate
        group: drift
        shared:
        - code
      code: |-
        #if BOOST_BEAST_DOXYGEN
        template<class... BufferSequence>
        buffers_cat_view<BufferSequence...>
        buffers_cat(BufferSequence const&... buffers)
        #else
        template<class B1, class... Bn>
        buffers_cat_view<B1, Bn...>
        buffers_cat(B1 const& b1, Bn const&... bn)
        #endif
      language: cpp
      highlights:
      - lines: '2-4'
        notes: |-
          And here's another example. The same trick for variadic templates.
          Nothing checks the first version of the function, because nothing compiles it.
  - id: toolchain
    label: Because of that, a second toolchain
    target_minutes: 1
    transition_words: And that's what our workflow looked like
    claims:
    - xml-workflow
    media:
    - code
    - line
    slides:
    - id: docca-pipeline
      kind: diagram
      on_screen: ''
      assertion: >-
        The Boost documentation toolchain of the time: headers into Doxygen, Doxygen's XML into docca's XSLT, Quickbook
        into BoostBook into HTML.
      diagram: |-
        graph LR
          classDef artifact fill:#FFBB33,stroke:#FDD37A,stroke-width:2px,color:#1B2440;
          classDef stage fill:#F6F6F7,stroke:#FF8933,stroke-width:2px,color:#1B2440;
          classDef ours fill:#C9A7F0,stroke:#A97FD8,stroke-width:2px,stroke-dasharray:4 2,color:#1B2440;
          H{"Headers"}:::artifact
          D["Doxygen"]:::stage
          X{"XML"}:::artifact
          C["docca<br/>(XSLT, ours)"]:::ours
          Q{"Quickbook"}:::artifact
          B["BoostBook"]:::stage
          O{"HTML"}:::artifact
          H --> D --> X --> C --> Q --> B --> O
      labels: integrated
      chart_kind: flow
      chart_rationale: >-
        A pipeline is a flow. Artifacts are diamonds and stages are boxes, so the eye reads file, tool, file, tool; the
        one stage drawn differently is the one we had to write and keep.
      emphasis:
        element: the dashed docca stage in the middle
        why: >-
          Everything else in the chain is somebody else's tool; that box is thousands of lines we maintained only
          to make the output ours.
      notes: |-
        And that's what our workflow looked like. 
        
        We created and maintained this intermediary tool called docca to convert Doxygen's XML output 
        into the markup format our regular documentation tools understood. 
        
        At some point, we had people working full-time on this tool, just to make the output look like 
        the rest of the documentation.

        So we had a second declaration of everything it couldn't understand, documentation code 
        that was drifting and nobody compiled, and a toolchain of our own just to customize it.
      why: >-
        The second toolchain is drawn as the chain it was, so the room sees where the maintained part sat before seeing
        its code.
  - id: reveal
    label: The question and the tool
    target_minutes: 1
    transition_words: So we asked the obvious question
    purpose: >-
      The turn: the dramatic question, then the tool that answers it, said outright.
    media:
    - line
    - image
    slides:
    - id: what-if
      kind: line
      on_screen: What if we just used the compiler?
      assertion: One question, centred.
      notes: |-
        So we asked the obvious question.

        Clang already knows everything we were trying to explain to
        Doxygen.
        
        What if we created a tool where the documentation came from the compiler?
      why: >-
        The turn from "what is" to "what could be" (Duarte). A question, not a claim, so the audience answers it
        themselves a second before the reveal.
      dramatic_question: true
      motion:
        kind: auto-animate
        group: drift
        shared:
        - main
    - id: mrdocs-reveal
      kind: cover
      on_screen: Mr.Docs
      assertion: The Mr.Docs hero, flying in, large, on the navy.
      notes: |-
        So we built this tool /tul/. Mr.Docs. It just uses the compiler under the hood.

        It is a C++ reference documentation generator built on Clang. 
        
        - It reads your project through the compilation database, 
        - it builds a corpus /ˈkɔrpəs/ of every symbol from the real AST, and 
        
        It also has a presentation layer that is:
        
        - Completely encapsulated from the extraction phase, and
        - it's extremely customizable. 
        
        The rest of this talk is about how it works and what that lets you do.
      assets:
      - assets/mrdocs-hero.png
      motion:
        kind: transition
        name: zoom
      emotion_cue: Pause on the hero; let them look before speaking.
      why: >-
        The reveal. The hero is the answer to the question, so it lands as a payoff rather than a logo. The empowerment
        promise (Winston) goes here, after the audience cares and before the tour.
  - id: corpus
    label: One corpus
    target_minutes: 1
    transition_words: Here is the workflow in one diagram
    claims:
    - one-corpus
    media:
    - diagram
    explains_system: true
    parts_beat: once
    slides:
    - id: one-corpus
      kind: diagram
      on_screen: ''
      assertion: >-
        The pipeline. Source and configuration flow into one corpus, the corpus into generators, generators into
        rendered docs and structured data.
      notes: |-
        Here is the workflow in one diagram.

        The inputs are your C++ headers with its doc comments, and a
        small configuration file. 
        
        We use Clang to compile the code and produce a corpus with all symbols from the AST.
        
        Generators turn that one corpus into whatever you need. 
        So you can have many outputs for the same corpus.
        
        Finally, you can define extensions to either transform the corpus or define custom generators.
      labels: integrated
      chart_kind: flow
      chart_rationale: 'A flow chart because the point is a sequence with one convergence: everything meets at the
        corpus.'
      emphasis:
        element: the corpus node
        why: It is the one thing every input feeds and every output comes from; the eye should land there first.
      diagram: |-
        graph LR
          classDef input fill:#9FC7FF,stroke:#6FA8FF,stroke-width:2px,color:#1B2440;
          classDef stage fill:#FFBB33,stroke:#FDD37A,stroke-width:2px,color:#1B2440;
          classDef output fill:#F6F6F7,stroke:#FF8933,stroke-width:2px,color:#1B2440;
          classDef ext fill:#C9A7F0,stroke:#A97FD8,stroke-width:2px,stroke-dasharray:4 2,color:#1B2440;
          CPP["C++ source<br/>doc comments"]:::input
          CFG[Configuration]:::input
          CORPUS([Symbol corpus]):::stage
          GENS([Generators]):::stage
          RENDERED[Rendered documentation]:::output
          DATA[Structured data]:::output
          EXT[Extensions]:::ext
          CPP --> CORPUS
          CFG --> CORPUS
          CORPUS --> GENS
          GENS --> RENDERED
          GENS --> DATA
          EXT <-.-> CORPUS
          EXT <-.-> GENS
      why: >-
        The mental model for the whole talk. Building it in fragments keeps the picture in step with the sentence
        (Mayer's temporal contiguity). It comes back in the Extensions section with the hook points lit up.
- id: tour
  label: Act 2. The tour, in the order of the docs
  spine:
  - none
  # the tour is what could be: the tool, chapter by chapter. Where a chapter shows the Doxygen-era way before
  # the Mr.Docs way, the beat is flagged `contrast`, and those crossings are what P2 counts.
  side: what_could_be
  arousal: curiosity
  cycles_idea: true
  star_moment: false
  # The claims below are what the tour argues, not what it visits. The itinerary is the chapters (end of this file)
  # and each tour beat's `docs` list, kept as a record of what the beat covers; no check enforces it.
  claims:
  - id: production
    text: Boost.URL's published reference on boost.org is generated by MrDocs. MrDocs reference as well.
    evidence:
    - kind: live-page
      ref: assets/boost-url-live/url_view.html (bundled boost.org page)
  - id: no-workarounds
    text: The idioms that needed a macro need a configuration line or a comment command instead.
    evidence:
    - kind: file
      ref: docs/modules/ROOT/pages/migration-notes.adoc
  - id: compiler-knowledge
    text: >-
      Extraction options (sfinae, overloads, inherit-base-members, auto-function-objects) are only possible
      because the tool reads the code through the compiler.
    evidence:
    - kind: file
      ref: docs/modules/ROOT/pages/configuration/extraction.adoc
