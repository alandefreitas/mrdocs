- id: new-normal
  label: Act 4. Ever since then
  spine:
  - ever-since-then
  side: what_could_be
  arousal: awe
  cycles_idea: true
  references_act: story
  new_bliss: >-
    The header from the beginning of the story is on boost.org today: one declaration, no macro, read
    by the compiler and by the documentation tool through the same front end.
  claims:
  - id: full-circle
    text: The same header that broke Doxygen is rendered correctly on boost.org by MrDocs.
    evidence:
    - kind: live-page
      ref: assets/boost-url-live/url_view.html
  # the beats of this act, in order: what is said, one point each, with target minutes and transition words
  beats:
  - id: full-circle
    label: Full circle
    target_minutes: 1.5
    transition_words: Remember the page from the beginning?
    claims:
    - full-circle
    media:
    - live
    - table
    slides:
    - id: full-circle
      kind: image
      fit: bleed
      on_screen: Boost.URL
      assertion: The Boost.URL reference on boost.org again, the same library the story started with.
      notes: |-
        My starting point was this library. And here it is today. 
        
        One declaration per symbol, no ugly macros anymore. No workarounds. No missing symbols.
        And with a presentation that matches the rest of the documentation.
        
        We read it just like the compiler does with the same front end. And everything is verifiable.
        There's code in these headers that exists just for the documentation tool anymore.
      why: >-
        "Ever since then". Going full circle is the strongest close available (SPEAKING-NOTES), and the morph from
        the broken page to the fixed one makes the story's resolution visible.
      assets:
      - assets/story/boost-url-view.png
      image_role: represents
      emphasis:
        element: 'the synopsis: one declaration, no macro'
        why: The header that needed a second version of the truth now has one, and the page shows it.

    - id: the-trade
      kind: table
      on_screen: ''
      assertion: >-
        The table from the beginning, with the generated column split in two: Mr.Docs meets every row, the tool
        you have today shares only the one about staying in sync.
      notes: |-
        So here is the same table from the beginning. 
        
        Now it's really convenient to get what you want because you don't have to customize more than you need. 
        And that ensures you're going to get what's best for the user. 
        
        And the comments don't only stay next to the code. We also have a single version of
        the truth because we're using the same symbols for the documentation. 
        
        And I think what's even more interesting is how many other use cases we unlocked along the way. 
        I can't even have a row for each use case. All documentation snippets tested, ghostwriters, 
        index generators, reflection, identifying breaking changes, ...
      table:
        header:
        - ''
        - Mr.Docs
        - Other
        - By hand
        - None
        rows:
        - - Convenient (author)
          - 'yes'
          - maybe
          - 'no'
          - 'yes'
        - - Friendly output (user)
          - 'yes'
          - maybe
          - 'yes'
          - 'no'
        - - AI-friendly
          - 'yes'
          - 'yes'
          - 'no'
          - 'no'
        - - IDE integration
          - 'yes'
          - 'yes'
          - 'no'
          - 'no'
        - - Verifiable
          - 'yes'
          - 'no'
          - 'no'
          - 'no'
        - - In sync with source
          - 'yes'
          - 'maybe'
          - 'no'
          - 'no'
        - - Single source of truth
          - 'yes'
          - 'no'
          - 'no'
          - 'no'
        - - Extensions
          - 'yes'
          - 'no'
          - 'no'
          - 'no'
        highlight_cols:
        - 2
      why: >-
        The second half of the design-notes table: the comparison with other tools is a conclusion, not a motivation,
        so it comes after the tour has shown every row. Same rows and columns as the table the story opened with, so
        the audience recognizes it; the one change is the generated column split into Mr.Docs and the other tools,
        and the column that was all questions at "or is it?" is now all yes.
  - id: close
    label: The idea and the ask
    target_minutes: 1.25
    docs:
    - license.adoc
    transition_words: Here is what I would like you to do
    purpose: >-
      The ask, then the idea as the last words on screen.
    media:
    - line
    - image
    slides:
    - id: call-to-action
      kind: cta
      on_screen: mrdocs.com
      assertion: The QR code, mrdocs.com, and the word Download.
      notes: |-
        Here is what I would like you to do. Download it. Point it at your
        library tonight with the smallest mrdocs.yml you saw earlier. Look
        at what comes out. If something is wrong, that is a bug report I
        want. If nothing is wrong, tell someone.
      cta_url: https://mrdocs.com
      qr_asset: assets/mrdocs-qr.svg
      why: >-
        One action, concrete, tonight (Anderson: worth sharing; the ask is for the audience's benefit). The QR is
        on screen long enough to scan.
    - id: the-line-positive
      kind: conclusions
      on_screen: 'Mr.Docs: Native C++. No workarounds.'
      assertion: The hero from the reveal again, with the one idea in its positive form under it and the QR code for the questions.
      assets:
      - assets/mrdocs-hero.png
      qr_asset: assets/mrdocs-qr.svg
      cta_url: https://mrdocs.com
      notes: |-
        And if that is the one thing I want you to take out of this presentation. 
        More than a feature list, it's a property. 
        
        It understands C++ the way the compiler does, so nothing is lost and nothing
        in your headers has to be faked for it.

        That's all I have. 
        
        I believe there's time for two more questions.
        
        (This stays on screen while we take questions)
        
        (Repeat each question for the room and the recording)

      restates_idea: true
      why: >-
        The idea, positive form, as the second and last hero moment. The morph from the negative line is the arc
        of the talk in one motion. The QR stays up through the questions, the longest any slide is on screen.
    - id: cppcon-title-card-again
      kind: title-card
      on_screen: ''
      assertion: The conference's card again, so the closing frame is one step away instead of at the start of the deck.
      notes: |-
        The conference card, for after the questions. It is here so the frame is one arrow away and the deck does
        not have to jump back to the first slide.
      assets:
      - assets/cppcon-title-card.png
      why: A copy of the first slide at the end, so the card can be shown after the questions without leaving the closing slides.
# the map shown to the audience: the nav sections the tour visits, in nav order. Contribute is deliberately not a
