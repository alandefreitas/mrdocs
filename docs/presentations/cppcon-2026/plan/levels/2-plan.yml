    - id: transforms-title
      kind: line
      on_screen: Corpus Transforms
      assertion: The first extension point, named before its first example.
      # Extensions / Corpus Transforms
      notes: |-
        Now something I'm very excited about: corpus transforms.
        
        This is the first feature here that we can only define with a script extension.
        
        These are scripts that operate on the whole corpus at the extraction
        phase, and they send the adjusted corpus to all generators.
        
        You can use these scripts to apply project conventions.
        They are very easy to write and share.
        
        As I mentioned, you can write them in both JavaScript and Lua.
        JavaScript is more familiar to most people. And Lua is a language
        designed to be embedded in other programs, so it is very small and fast.
