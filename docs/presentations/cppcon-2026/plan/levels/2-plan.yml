    - id: usage
      kind: code
      on_screen: ''
      assertion: >-
        A three-line mrdocs.yml next to the command that runs it, once for each way of getting a compilation database.
      # Getting Started / Basic Usage
      notes: |-
        You drive it with a YAML file or command-line flags; they are the
        same options. The one thing it needs from you is a compilation
        database, because that is how it knows how to compile your code the
        way you do.

        Three ways to get one.
      why: >-
        The "one YAML, one command" objective, shown as a morph so the file changes and the command does not. The
        command and the file are two things, so they are two frames.
      motion:
        kind: auto-animate
        group: usage
        shared:
        - code
      steps:
      - blocks:
        - title: docs/mrdocs.yml
          language: yaml
          code: |-
            source-root: ..
            compilation-database: compile_commands.json
          highlight:
          - 2
        - title: terminal
          language: bash
          code: |-
            mrdocs --config=docs/mrdocs.yml
        notes: |-
          To render documentation for your library, if you already have a compile_commands.json, from your
          build system or by hand, point to it. Mr.Docs will compile it with the same flags.
      - blocks:
        - title: docs/mrdocs.yml
          language: yaml
          code: |-
            source-root: ..
            compilation-database: ../CMakeLists.txt
          highlight:
          - 2
        - title: terminal
          language: bash
          code: |-
            mrdocs --config=docs/mrdocs.yml
        notes: |-
          A CMake project: point at the CMakeLists.txt, and Mr.Docs configures it and reads the database CMake writes.
      - blocks:
        - title: docs/mrdocs.yml
          language: yaml
          code: |-
            source-root: ..
            input:
              - ../include
            includes:
              - ../include
          highlight:
          - 2
          - 3
        - title: terminal
          language: bash
          code: |-
            mrdocs --config=docs/mrdocs.yml
        notes: |-
          Or, for simple cases, you can let it generate the compilation database for you
          from the configuration filters you're likely to define anyway.
    - id: migration
      kind: code
      on_screen: ''
      title: include/logr/log.hpp
      assertion: >-
        A public function returning a detail type, declared once, with its real return type.
      why: >-
        Direct answer to the Act 1 villain, in the same visual language: the same idiom, now one declaration.
      code: |-
        namespace logr::detail {
        struct scope_token { ~scope_token(); };
        }
        namespace logr {
        /// Attach a key/value pair to every log line.
        detail::scope_token
        scoped_context(char const* key, char const* value);
        }
      language: cpp
      # Getting Started / Migration Notes
      notes: |-
        One difference you'll notice immediately is that we have one design decision: we only accept valid code. 
        
        The idioms that would need a macro in Doxygen will either be understood directly or need a configuration line or a comment command instead.
      highlights:
      - lines: '1-3'
        notes: |-
          For instance: we have a detail type that's not part of the API.
      - lines: '6-7'
        notes: |-
          And it's returned by a public function the way the compiler sees it. No workarounds.
    - id: migration-config
      kind: code
      on_screen: ''
      title: docs/mrdocs.yml
      assertion: One configuration entry marks the whole detail namespace implementation-defined.
      # Getting Started / Migration Notes, the configuration
      notes: |-
        Then with one line of configuration: everything under logr::detail is declared implementation-defined. 
        
        The header doesn't change. Nobody has to write a second declaration the compiler doesn't see.
        
        The documentation tool sees the same as the compiler.
      why: The intent moves out of the header and into one line the whole project shares.
      code: |-
        implementation-defined:
          - 'logr::detail::**'
      language: yaml
      highlights:
      - '2'
    - id: migration-rendered
      kind: rendered
      on_screen: ''
      doc_html: assets/rendered/migration-scoped.html
      assertion: The generated page shows the placeholder where the detail type was; the type itself has no page.
      # Getting Started / Migration Notes, the page
      notes: |-
        And this is the page. We have a placeholder where the detail type was.
        
        And the type itself gets no documentation page.
        
        By the way, you could also achieve the same, symbol by symbol, with a command in the comment.
      why: The output is the evidence; a comment describing it would be a claim.
    - id: migration-function-object
      kind: code
      on_screen: ''
      title: include/numerics/clamp.hpp
      assertion: An algorithm function object, as libraries write it, with the documentation on the call operator.
      why: The second idiom from the migration page, in the form libraries actually write.
      code: |-
        struct clamp_fn
        {
            /// Constrain a value to `[lo, hi]`.
            template <class T>
            T operator()(T const& v, T const& lo,
                         T const& hi) const;
        };
        inline constexpr clamp_fn clamp = {};
      language: cpp
      # Getting Started / Migration Notes, function objects
      notes: |-
        Another idiom where people use macros is functors. And these macros can become extremely ugly.
      highlights:
      - lines: '3-6'
        notes: |-
          A struct with one call operator; you document the operator, where the signature is.
      - lines: '8'
        notes: |-
          And a constexpr variable of that type.
    - id: migration-function-object-rendered
      kind: rendered
      on_screen: ''
      doc_html: assets/rendered/migration-clamp.html
      assertion: >-
        The variable's page reads as a function: the operator's signature, brief, and parameters.
      # Getting Started / Migration Notes, the page
      notes: |-
        And the page is just a function page: the operator's signature, brief, and parameters. 
        
        You don't need any configuration for this, although you could make any of these features explicit.

        That layer of macros is gone. The documented C++ is the same as the compiled C++.
      restates_idea: true
      why: >-
        The output as evidence, and the last sentence is the idea, cycled (Winston).
