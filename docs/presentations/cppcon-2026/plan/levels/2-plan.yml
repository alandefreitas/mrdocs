    - id: noop-check-ctest
      kind: code
      on_screen: ''
      assertion: 'CMakeLists.txt: the example from the No-op page, as written in the docs.'
      # Generators / No-op
      notes: |-
        And then we can just use this as a test to make sure any new commit to the 
        project doesn't forget to document something.
      title: CMakeLists.txt
      file: examples/generators/noop/documentation-check/CMakeLists.txt
      include: tag=check,indent=0
      language: cmake
    - id: noop-agent-loop
      kind: code
      on_screen: ''
      assertion: 'fix-docs.py: the example from the No-op page, as written in the docs.'
      notes: |-
        With this, we can even create an AI loop to document the whole library.
      title: fix-docs.py
      file: examples/generators/noop/fix-loop/fix-docs.py
      language: python
      highlights:
      - lines: '42-62'
        notes: >-
          Here's the main loop for a generous, maximum number of rounds:
      - lines: '43'
        notes: >-
          We check if everything is documented.
      - lines: '50-54'
        notes: >-
          If it's not documented yet, we look at the diagnostics, make sure we're not stalled.
      - lines: '57'
        notes: >-
          Then we ask the agent to repair it.
          
          We have a custom prompt in a clean context that tells the agent, 
          
          Hey, don't worry about anything. Just fix this function or those problems with those functions.
          Here are the functions and the line numbers. 
          Figure out what they do and just do that in a clean context, so you're not going to get tired or something.
      - lines: '42'
        notes: >-
          You run MrDocs again until it's done.
          
          At worst, you get a reasonable starting point for your documentation.
- id: extensions
  label: 'Act 3. The surprise: extensions'
  spine:
  - none
  # what could be, again, and further than anyone expected: the examples were built for this talk, and nobody has seen
  # a documentation tool do these things. The star moment is here.
  side: what_could_be
  arousal: surprise
  cycles_idea: true
  star_moment: true
  claims:
  - id: extension-points
    text: Two hooks on the pipeline give six ways to extend it, from a template to the library.
    evidence:
    - kind: file
      ref: docs/modules/ROOT/pages/extensions/handlebars-extensions.adoc
  - id: extension-examples
    text: >-
      The examples on the extensions pages were built for this talk, and each does something no documentation
      tool has done: a project's conventions become official reference (is_ predicates get their brief, parse
      and format pairs cross-link, low-quality briefs fail the build), a technical writer's Markdown merges into
      the developer's verified brief, one corpus walk emits a search index and a table of contents in three
      formats, snippets stay in sync between comments and compiled tests, three template directories give JSON
      Lines, Markdown and LaTeX, and a generator writes Boost.Describe annotations back into the headers.
    evidence:
    - kind: file
      ref: >-
        examples/extensions/ (project-conventions, ghostwriter) and examples/generators/ (script-driven: json,
        search-index, toc, snippets, describe; data-driven: jsonl, md, tex)
    - kind: file
      ref: docs/modules/ROOT/pages/extensions/corpus-transforms.adoc, script-generators.adoc, data-driven-generators.adoc
  # the beats of this act, in order: what is said, one point each, with target minutes and transition words
  beats:
  - id: ext-hooks
    chapter: extensions
    label: Two hooks on the pipeline
    target_minutes: 4
    transition_words: Extensions
    claims:
    - extension-points
    media:
    - diagram
    - code
    - image
    docs:
    - extensions/handlebars-extensions.adoc
    - extensions/data-driven-generators.adoc
    explains_system: true
    parts_beat: corpus
    slides:
    - id: extensions-title
      kind: word
      on_screen: Extensions
      assertion: Extensions
      # Generators / Overview
      notes: |-
        But what I think is the really special feature of MrDocs is the extension system.
    - id: extension-points
      kind: diagram
      on_screen: ''
      assertion: The Act 2 pipeline again; the two extension hooks (corpus, generators) light up.
      notes: |-
        Here is the pipeline from the beginning, with the two places you can
        manipulate here. 
        
        In the extraction phase, you can manipulate and transform the corpus. 
        
        In the generator phase, change how it renders, or replace it completely. 
        
        We provide many ways to do that, depending on how much customization you need.
      labels: integrated
      chart_kind: flow
      chart_rationale: The same flow chart as the pipeline slide, so the hooks read as additions to a known picture.
      emphasis:
        element: the two dashed extension edges
        why: >-
          They are the only new elements on a diagram the audience already knows, so they carry the whole point.
      diagram: |-
        graph LR
          classDef input fill:#9FC7FF,stroke:#6FA8FF,stroke-width:2px,color:#1B2440;
          classDef stage fill:#FFBB33,stroke:#FDD37A,stroke-width:2px,color:#1B2440;
          classDef output fill:#F6F6F7,stroke:#FF8933,stroke-width:2px,color:#1B2440;
          classDef ext fill:#C9A7F0,stroke:#A97FD8,stroke-width:2px,stroke-dasharray:4 2,color:#1B2440;
          CPP["C++ source<br/>doc comments"]:::input
          CFG[Configuration]:::input
          CORPUS([Symbol corpus]):::stage
          GENS([Generators]):::stage
          RENDERED[Rendered documentation]:::output
          DATA[Structured data]:::output
          EXT[Extensions]:::ext
          CPP --> CORPUS
          CFG --> CORPUS
          CORPUS --> GENS
          GENS --> RENDERED
          GENS --> DATA
          EXT <-.-> CORPUS
          EXT <-.-> GENS
      why: >-
        Reusing the Act 2 diagram is the cheapest possible re-orientation, and it makes the extension surface look
        like what it is: two hooks on a pipeline the audience already knows.
