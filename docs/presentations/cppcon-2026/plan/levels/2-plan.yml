    - id: script-snippets
      kind: code
      on_screen: ''
      assertion: 'addons/extensions/snippets.lua: the example from the Script Generators page, as written in the docs.'
      notes: |-
        Round-trip extensions that define both transforms and generators are very useful at times.
        
        For instance, a common use case is making sure all documentation examples work.
        This means some tested snippets have to be imported into the documentation, and the inline snippets 
        from the documentation have to be exported and tested directly. 
        
        So here is the snippets extension: it imports examples from the test files and exports the inline ones
        so that they are tested.
      title: addons/extensions/snippets.lua
      file: examples/generators/script-driven/snippets/addons/extensions/snippets.lua
      language: lua
      highlights:
      - lines: '14,17'
        notes: >-
          Here we register the transform. And for each symbol...
      - lines: '19,21'
        notes: >-
          ...we look for a corresponding file with tests for these symbols.
      - lines: '27'
        notes: >-
          For each snippet in the file that's about this symbol
      - lines: '46-48'
        notes: >-
          Recreate a snippet, writing the documentation as part of the corpus.
          Then we mark this snippet as imported in a global variable of the module.
      - lines: '61'
        notes: >-
          The very same extension also defines a generator that does the inverse.
      - lines: '71-76'
        notes: >-
          It reads the code blocks from a symbol.
      - lines: '77-84'
        notes: >-
          And stores those blocks as blocks belonging to the corresponding test files.
      - lines: '88-101'
        notes: >-
          It then creates one test file for each group of inline snippets that need tests.

