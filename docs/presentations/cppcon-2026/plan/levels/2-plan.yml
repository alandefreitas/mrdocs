  - id: generators
    chapter: generators
    label: Generators
    target_minutes: 4.25
    transition_words: Generators
    purpose: >-
      Shows the five formats the room already knows in a breath each, and spends its minutes on the one example that changes a workflow, the no-op linter and repair loop.
    media:
    - code
    - diagram
    docs:
    - generators/index.adoc
    - generators/html.adoc
    - generators/adoc.adoc
    - generators/json.adoc
    - generators/xml.adoc
    - generators/noop.adoc
    - generators/reference.adoc
    question_to_room: true
    slides:
    - id: generator-title
      kind: word
      on_screen: Generators
      assertion: Generators
      # Generators / Overview
      notes: |-
        So, what are the generators? As we mentioned, the presentation layer in MrDocs 
        is independent, which means we can have lots of generators. 
        And that means you only have to provide the exact amount of customization you need.
    - id: quadrant
      kind: diagram
      on_screen: ''
      assertion: The redundancy-versus-convenience quadrant chart from the docs.
      # Generators / Overview
      notes: |-
        Among the generators, we have a trade-off between redundancy 
        and convenience. Customizing is less convenient, so we also
        don't want to customize more than we need.
        
        HTML and AsciiDoc are the most convenient and redundant because the 
        layout is already set. For both of them, you can customize 
        the layout and the style, but you have to do it in a way that fits the
        generator's model.
        
        On the other extreme, XML and JSON are the least redundant formats.
        You can use these as input to other tools.
        
        Custom templates and custom generators are in between.
        MrDocs makes it very easy to create those, and the repository includes 
        some custom generators already.
      labels: integrated
      chart_kind: quadrant
      chart_rationale: A quadrant because the choice is a trade between two continuous qualities, not a ranking.
      emphasis:
        element: the HTML point in the top-right
        why: It is where most people start, and the chart's job is to show what they trade for that.
      diagram: |-
        quadrantChart
          x-axis Low redundancy --> High redundancy
          y-axis Low convenience --> High convenience
          Ideal: [0.04, 0.96] radius: 4, color: #cccccc, stroke-color: #cccccc, stroke-width: 1px
          HTML: [0.92, 0.94]
          AsciiDoc: [0.78, 0.84]
          Custom Templates: [0.64, 0.73]
          Data-Driven Generators: [0.5, 0.61]
          Custom Generators: [0.36, 0.48]
          JSON: [0.08, 0.08]
          XML: [0.15, 0.23]
          Clang AST: [0.88, 0.06] radius: 5, color: #f1c7c7, stroke-color: #f1c7c7, stroke-width: 1px
      why: The docs' own chart; the audience saw it on the website if they looked.
    - id: noop
      kind: code
      on_screen: ''
      assertion: 'No-op: the example from the No-op page, as written in the docs.'
      # Generators / No-op
      notes: |-
        One interesting generator is the no-op generator.
