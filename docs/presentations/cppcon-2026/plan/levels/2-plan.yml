chapters:
- id: getting-started
  label: Getting Started
  mnemonic_image: assets/roadmap/getting-started.svg
  points:
  - Demo gallery, in production on boost.org and dogfooded on mrdocs.com
  - Install is a download
  - One YAML file, one command, three ways to get a compilation database
  - Idioms without workarounds
- id: commands
  label: Commands
  mnemonic_image: assets/roadmap/commands.svg
  points:
  - The comments you already write
  - Metadata commands replace macros with words
  - 'Inline commands: formatting, links, cross-references, copydoc'
- id: configuration
  label: Configuration
  mnemonic_image: assets/roadmap/configuration.svg
  points:
  - One file, every key a flag
  - 'Five groups: inputs, filters, extraction, output, diagnostics'
  - Filters decide what exists; extraction decides how it reads
- id: generators
  label: Generators
  mnemonic_image: assets/roadmap/generators.svg
  points:
  - Five generators, one corpus
  - Redundancy versus convenience
- id: extensions
  label: Extensions
  mnemonic_image: assets/roadmap/extensions.svg
  points:
  - Two hooks on the pipeline
  - Templates, folders, scripts, Antora, the library
  - Contribute
