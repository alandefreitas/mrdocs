                    - highlights
  chapters:
    description: >-
      The sections of the tour the audience will be shown as a map, each with an image that stands for it, so the
      map is remembered as pictures rather than as a list of names. Tour beats name their chapter and list the docs
      pages under it. Why: The chapters are not the structure of the talk, the acts are; they are how the tour is
      presented to the audience, as a map, and they are where the decision of which docs sections to tour is made:
      a nav section that is not a chapter is not toured. An early map helps people organise what follows, and pictures
      are remembered better than a list of names; the research's cap is five. Evidence, strongest first (experiment):
      C2-3-07 (experiment; Mayer2003); C2-2-05 (expert opinion; Alley2005, Freitas2026, Kosslyn2012); C2-3-06 (expert
      opinion; Kosslyn2012, Winston2018). Checks: P10 (script: roadmap chapters, each with a mnemonic image asset
      that exists), P19 (script: every beat has transition words, and the notes of its first slide contain them).
    type: array
    minItems: 1
    maxItems: 6
    items:
      type: object
      required:
      - id
      - label
      - mnemonic_image
      - points
      additionalProperties: false
      properties:
        label:
          description: >-
            The chapter's name as it will be said or shown on the map. Why: The name as it is said and shown on
            the map. Evidence, strongest first (experiment): C2-3-07 (experiment; Mayer2003); C2-2-05 (expert opinion;
            Alley2005, Freitas2026, Kosslyn2012). Checks: P10 (script: roadmap chapters, each with a mnemonic image
            asset that exists).
          type: string
          minLength: 3
        id:
          description: >-
            A short identifier the beats and slides use to refer to this chapter. Why: Cross-reference used by the
            beats to place themselves in a chapter. Bookkeeping. No research criterion behind it.
          type: string
          pattern: ^[a-z0-9-]+$
        mnemonic_image:
          description: >-
            Path to the picture that stands for this chapter on the map slide and reappears when the chapter arrives.
            Why: The map is remembered as pictures; each image must exist. Evidence, strongest first (experiment):
            C2-3-07 (experiment; Mayer2003); C2-2-05 (expert opinion; Alley2005, Freitas2026, Kosslyn2012). Checks:
            P10 (script: roadmap chapters, each with a mnemonic image asset that exists).
          type: string
        points:
          description: >-
            The few things this chapter says, at most five, each in one line; a summary of the chapter's pages,
            not a list of them. Why: At most five per chapter, so the map stays a map and not an outline. Evidence,
            strongest first (experiment): C2-3-07 (experiment; Mayer2003); C2-2-05 (expert opinion; Alley2005, Freitas2026,
            Kosslyn2012). Checks: P10 (script: roadmap chapters, each with a mnemonic image asset that exists).
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            minLength: 5
