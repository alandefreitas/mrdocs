# Official repository: https://github.com/cppalliance/mrdocs
#
# Per-OS smoke validation of the produced mrdocs binary plus demo
# generation against vendored third-party projects. Runs on every PR
# (always required) so the `Releases / Linux/Windows/macOS` status
# checks always reflect an end-to-end install + run of the binary.

name: Releases

on:
  workflow_call:
    inputs:
      submatrix:
        description: 'JSON-encoded releases submatrix from cpp-matrix'
        type: string
        required: true
      use-develop-binaries:
        description: 'true to fetch packages from develop-release instead of this run'
        type: boolean
        default: false

jobs:
  releases:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.submatrix) }}

    defaults:
      run:
        shell: bash

    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    permissions:
      contents: read
    steps:
      - name: Container Bootstrap
        uses: alandefreitas/cpp-actions/container-bootstrap@v1.9.5

      - name: Install packages
        uses: alandefreitas/cpp-actions/package-install@v1.9.5
        with:
          apt-get: build-essential asciidoctor cmake ninja-build bzip2 git rsync jq

      - name: Clone MrDocs
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Ninja
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v6

      # The preparation of the Linux release container lives in one place, in
      # two phases around Setup C++.
      - name: Prepare The Linux Release Container (toolchain)
        if: ${{ matrix.mrdocs-linux-release == 'true' }}
        uses: ./.github/actions/linux-release-container
        with:
          phase: before-setup-cpp

      - name: Setup C++
        uses: alandefreitas/cpp-actions/setup-cpp@v1.9.5
        id: setup-cpp
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}

      - name: Prepare The Linux Release Container (compiler)
        if: ${{ matrix.mrdocs-linux-release == 'true' }}
        uses: ./.github/actions/linux-release-container
        with:
          phase: after-setup-cpp
          cc: ${{ steps.setup-cpp.outputs.cc }}
          cxx: ${{ steps.setup-cpp.outputs.cxx }}

      # When use-develop-binaries=false the package comes from this run's
      # ci-build artifact. When true we pull the matching platform asset
      # from the rolling develop-release; the scope-detector only sets
      # this when it verified the cache is warm.
      - name: Download MrDocs package (fresh build)
        if: ${{ !inputs.use-develop-binaries }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.mrdocs-release-package-artifact }}
          path: packages

      - name: Download MrDocs package (develop-release fallback)
        if: ${{ inputs.use-develop-binaries }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p packages
          case "${{ runner.os }}" in
            Linux)   pattern='*Linux*' ;;
            Windows) pattern='*Windows*' ;;
            macOS)   pattern='*Darwin*' ;;
            *) echo "::error::unknown runner.os: ${{ runner.os }}"; exit 1 ;;
          esac
          gh release download develop-release --pattern "$pattern" -D packages

      - name: Install MrDocs from Package
        run: .github/scripts/install-mrdocs-package.sh

      # The Linux release follows the manylinux policy: dynamically linked
      # against glibc, no glibc symbol above the floor, no GLIBC_ tag that is
      # not a version (GLIBC_PRIVATE, GLIBC_ABI_DT_RELR), RUNPATH
      # $ORIGIN/../lib, every GLIBCXX_/CXXABI_/GCC_ version the executable
      # needs defined by the bundled lib/libstdc++.so.6 and
      # lib/libgcc_s.so.1, and no needed library but the ones of glibc and
      # those two. See utils/cmake/release-linux.cmake. The check fails the
      # job; the fix is in the package, not in the floor. It runs only on the
      # package this run built: a package reused from develop-release is not
      # the one this run built, and the run that published it checked it.
      - name: Check Linux Portability
        if: ${{ runner.os == 'Linux' && !inputs.use-develop-binaries }}
        run: utils/release/check-linux-portability.sh "$MRDOCS_ROOT/bin/mrdocs"

      # The macOS release runs on macOS 14 or later, and a plugin's own
      # deployment target decides the oldest macOS it loads on, so the number
      # is part of the release. The deployment target is set in ci-build.yml
      # (matrix.macos-deployment-target); this reads it back from the
      # executable (LC_BUILD_VERSION, `minos`). The check fails the job, and
      # it skips a package reused from develop-release for
      # the same reason as the Linux one.
      - name: Check macOS Minimum Version
        if: ${{ matrix.macos-deployment-target != '' && !inputs.use-develop-binaries }}
        env:
          EXPECTED_MINOS: ${{ matrix.macos-deployment-target }}
        run: |
          minos=$(otool -l "$MRDOCS_ROOT/bin/mrdocs" | awk '$1 == "minos" { print $2; exit }')
          echo "minos of bin/mrdocs: ${minos:-none}"
          if [ "$minos" != "$EXPECTED_MINOS" ]; then
            echo "::error::bin/mrdocs has a minimum macOS of '${minos:-none}', expected $EXPECTED_MINOS"
            exit 1
          fi

      # Discovers the package through mrdocs_ROOT (the package-specific
      # find_package hint) rather than CMAKE_PREFIX_PATH. install-mrdocs-package.sh
      # exports MRDOCS_PREFIX as its CMake-valid form. On Linux this builds the
      # consumer plugin with the compiler of the job (GCC 15 in the release
      # container) and loads it into the package (consumer-plugin-loads). On
      # macOS it sets the deployment target the docs tell plugin authors to use.
      - name: CMake Consumer Test (release package)
        uses: alandefreitas/cpp-actions/cmake-workflow@v1.9.5
        with:
          cmake-version: '>=3.26'
          source-dir: tests/cmake
          build-dir: build/cmake-consumer
          cxxstd: ${{ matrix.cxxstd }}
          cc: ${{ steps.setup-cpp.outputs.cc || matrix.cc }}
          cxx: ${{ steps.setup-cpp.outputs.cxx || matrix.cxx }}
          generator: Ninja
          build-type: ${{ matrix.build-type }}
          extra-args: -D mrdocs_ROOT=${{ env.MRDOCS_PREFIX }} ${{ matrix.macos-deployment-target != '' && format('-D CMAKE_OSX_DEPLOYMENT_TARGET={0}', matrix.macos-deployment-target) || '' }}
          run-tests: true
          install: false

      # The plugin that the step above built is what the linux-distributions
      # job loads into the package on older distributions, which have no
      # compiler for the C++23 of the MrDocs headers.
      - name: Upload The Consumer Plugin (Linux)
        if: ${{ runner.os == 'Linux' && !inputs.use-develop-binaries }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-consumer-plugin
          path: tests/cmake/build/cmake-consumer/plugin-addons/plugins/libconsumer_plugin.so
          if-no-files-found: error
          retention-days: 1

      # The demos exist to be published, not to test anything: the copies that
      # reach the website come from Linux. macOS stays because it is fast (it
      # finishes before Linux, so it never blocks the job). Windows generation
      # takes hours on the large demos and validates nothing extra, so every
      # demo step is skipped there.
      - name: Clone Boost.URL
        if: runner.os != 'Windows'
        uses: alandefreitas/cpp-actions/boost-clone@v1.9.5
        with:
          branch: develop
          modules: url
          boost-dir: boost
          modules-scan-paths: '"test example"'
          modules-exclude-paths: ''
          trace-commands: true

      # Boost.URL (above) needs the Boost superproject, and Mr.Docs is this very
      # checkout, so both are handled on their own. Every other demo project is
      # driven from examples/third-party/projects.json (see the script).
      - name: Clone Demo Projects
        if: runner.os != 'Windows'
        run: .github/scripts/clone-demo-projects.sh

      - name: Generate Demos
        if: runner.os != 'Windows'
        run: .github/scripts/generate-demos.sh

      - name: Upload Demos as Artifacts
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: demos${{ (contains(fromJSON('["master", "develop"]'), github.ref_name) && format('-{0}', github.ref_name)) || '' }}-${{ runner.os }}
          path: demos.tar.gz
          retention-days: ${{ contains(fromJSON('["master", "develop"]'), github.ref_name) && '30' || '1' }}

  # The Linux package has to run on the distributions its glibc floor promises,
  # not only on the one that built it, and has to load a plugin there. Each
  # container is a distribution at or above the floor (see
  # utils/cmake/release-linux.cmake). The package carries its own libstdc++, and
  # the plugin is the one the releases job built in the release container with
  # GCC 15 against that package, so it needs a libstdc++ newer than the one of
  # any of these distributions: loading it is the test that one runtime serves
  # both. The job tests the package this run built. It is skipped when the run
  # reuses develop-release, whose package is not the one this run built and was
  # tested by the run that published it. It needs the releases job because that
  # job builds the plugin.
  linux-distributions:
    needs: releases
    if: ${{ contains(inputs.submatrix, 'ubuntu') && !inputs.use-develop-binaries }}
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:20.04', 'ubuntu:22.04', 'debian:11']
    defaults:
      run:
        shell: bash
    name: Linux ${{ matrix.image }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Clone MrDocs
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download MrDocs package
        uses: actions/download-artifact@v8
        with:
          name: release-packages-linux
          path: packages

      - name: Download The Consumer Plugin
        uses: actions/download-artifact@v8
        with:
          name: linux-consumer-plugin
          path: consumer-plugin

      - name: Run The Package And Load The Plugin
        run: .github/scripts/smoke-test-linux-package.sh "${{ matrix.image }}" packages consumer-plugin
